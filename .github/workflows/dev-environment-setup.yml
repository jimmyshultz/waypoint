name: Setup Development Environment

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  setup-dev-environment:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create development secrets example file
        run: |
          cat > .github/dev-secrets-example.md << 'EOF'
          # Development Secrets Setup Guide

          To set up your development environment, you'll need to configure the following secrets in GitHub:

          ## Required Secrets

          | Secret Name | Description | Example |
          |------------|-------------|---------|
          | `DB_CONNECTION_STRING` | PostgreSQL connection string | `postgresql://user:password@host:port/database?sslmode=require` |
          | `JWT_SECRET` | Secret key for JWT tokens | `your-secure-jwt-secret-key` |

          ## How to Add Secrets

          1. Go to your repository settings
          2. Navigate to "Secrets and variables" > "Actions"
          3. Click "New repository secret"
          4. Add each of the required secrets above
          
          For local development, copy `.env.example` to `.env` and update with your values.
          EOF
          
          echo "Created development secrets example file: .github/dev-secrets-example.md"
      
      - name: Verify .env.example exists
        run: |
          if [ -f .env.example ]; then
            echo ".env.example file exists"
          else
            echo "⚠️ .env.example file not found. Creating template..."
            
            cat > .env.example << 'EOF'
          # Database Configuration
          DB_CONNECTION_STRING=postgresql://user:password@host:port/database?sslmode=require

          # JWT Authentication 
          JWT_SECRET=your_jwt_secret_key_here
          JWT_ISSUER=waypoint_api
          JWT_AUDIENCE=waypoint_clients
          JWT_EXPIRY_MINUTES=60

          # Mapbox API (for geocoding)
          MAPBOX_API_KEY=your_mapbox_api_key_here

          # API Configuration
          API_URL=http://localhost:5000

          # Frontend Configuration
          REACT_APP_API_URL=http://localhost:5000/api
          REACT_APP_MAPBOX_TOKEN=your_mapbox_api_key_here
          EOF
            
            echo "Created .env.example template"
          fi
      
      - name: Verify repository structure
        run: |
          mkdir -p migrations
          mkdir -p scripts
          mkdir -p docs
          
          echo "Repository structure verified"
      
      - name: Generate setup documentation
        run: |
          cat > .github/DEVELOPMENT.md << 'EOF'
          # Development Setup

          This guide will help you set up your development environment for the Waypoint application.

          ## Prerequisites

          - Git
          - PostgreSQL client (for local database operations)
          - .NET SDK (for backend development)
          - Node.js and npm (for frontend development)

          ## Initial Setup

          1. Clone the repository
             ```bash
             git clone https://github.com/yourusername/waypoint.git
             cd waypoint
             ```

          2. Copy environment template
             ```bash
             cp .env.example .env
             ```

          3. Update `.env` with your database credentials and other settings

          ## GitHub Actions Workflows

          This project uses GitHub Actions for automation:

          - **Apply Migrations**: Automatically applies database migrations
          - **Revert Migrations**: Reverts database migrations (use with caution)
          - **Database Query**: Runs SQL queries against the database
          - **Database Backup**: Creates and stores database backups
          - **Setup Dev Environment**: Sets up a development environment

          To run these workflows:
          1. Go to the Actions tab in the GitHub repository
          2. Select the workflow you want to run
          3. Click "Run workflow"
          4. Provide any required inputs

          ## Secrets Management

          Sensitive information is stored in GitHub Secrets. See `.github/dev-secrets-example.md` for details.
          EOF
          
          echo "Generated development setup documentation: .github/DEVELOPMENT.md" 